{% extends "base.html" %}

{% block title %}发布公告 - 学校管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-edit me-2"></i>发布新公告</h3>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                    </div>
                {% endif %}

                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>温馨提示：</strong>请遵守学校相关规定，发布健康、正面的公告内容。
                </div>

                <form action="/announcement/create" method="post">
                    <div class="mb-4">
                        <label for="title" class="form-label">
                            <i class="fas fa-heading me-2"></i>公告标题
                        </label>
                        <input type="text" class="form-control" id="title" name="title"
                               placeholder="请输入公告标题" required maxlength="200">
                        <div class="form-text">标题最多 200 个字符</div>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label">
                            <i class="fas fa-file-alt me-2"></i>公告内容
                        </label>
                        <textarea class="form-control" id="content" name="content" rows="10"
                                  placeholder="请输入公告内容..." required></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-2"></i>发布公告
                        </button>
                        <a href="/announcements" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-2"></i>取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
