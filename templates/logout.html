{% extends "base.html" %}

{% block title %}退出登录 - 学校管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card">
            <div class="card-header bg-secondary text-white text-center py-4">
                <h3 class="mb-0"><i class="fas fa-sign-out-alt me-2"></i>退出登录</h3>
            </div>
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-5x text-success"></i>
                </div>
                <h4 class="text-success mb-3">已成功退出登录</h4>
                <p class="text-muted mb-4">感谢您使用学校管理系统，欢迎下次再来！</p>

                <div class="d-grid gap-2">
                    <a href="/" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>重新登录
                    </a>
                    <a href="/announcements" class="btn btn-outline-primary">
                        <i class="fas fa-bullhorn me-2"></i>查看公告
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
