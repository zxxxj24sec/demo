{% extends "base.html" %}

{% block title %}用户注册 - 学校管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white text-center py-4">
                <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>用户注册</h3>
            </div>
            <div class="card-body p-4">
                {% if page == 'form' %}
                    <form action="/register" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-2"></i>用户名
                            </label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="请输入用户名" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>密码
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="请输入密码" required>
                        </div>

                        <div class="mb-4">
                            <label for="gender" class="form-label">
                                <i class="fas fa-venus-mars me-2"></i>性别
                            </label>
                            <select class="form-control" id="gender" name="gender">
                                <option value="">请选择</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-2"></i>邮箱（可选）
                            </label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="请输入邮箱">
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="fas fa-user-plus me-2"></i>注册
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">已有账号？</p>
                        <a href="/" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>返回登录
                        </a>
                    </div>

                {% elif page == 'success' %}
                    <div class="text-center py-5">
                        <div class="mb-4">
                            <i class="fas fa-check-circle fa-5x text-success"></i>
                        </div>
                        <h4 class="text-success mb-3">注册成功！</h4>
                        <p class="text-muted">恭喜您已成为学校管理系统的用户</p>
                        <a href="/" class="btn btn-primary mt-3">
                            <i class="fas fa-sign-in-alt me-2"></i>立即登录
                        </a>
                    </div>

                {% elif page == 'fail' %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>注册失败！</strong><br>
                        {{ message }}
                    </div>
                    <div class="text-center">
                        <a href="/register" class="btn btn-primary">
                            <i class="fas fa-redo me-2"></i>重新注册
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
