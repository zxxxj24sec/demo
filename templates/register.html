<!DOCTYPE html>
<html>
<head>
    <title>用户注册</title>
</head>
<body>
    {% if page == 'form' %}
        <h1>用户注册</h1>
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="请输入用户名" required>
            <br><br>
            <input type="password" name="password" placeholder="请输入密码" required>
            <br><br>
            <button type="submit">注册</button>
        </form>
        <br>
        <a href="/"><button>返回登录</button></a>
    
    {% elif page == 'success' %}
        <h1>注册成功！</h1>
        <p>用户注册成功，请登录</p>
        <a href="/"><button>返回登录</button></a>
    
    {% elif page == 'fail' %}
        <h1>注册失败！</h1>
        <p>{{ message }}</p>
        <a href="/register"><button>重新注册</button></a>
    {% endif %}
</body>
</html>
