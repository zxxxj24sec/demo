<!DOCTYPE html>
<html>
<head>
    <title>登录结果</title>
</head>
<body>
    {% if success %}
        <h1>登录成功！</h1>
        <h2>欢迎 {{ username }}</h2>
        <a href="/profile"><button>进入个人主页</button></a>
        <br><br>
        <a href="/logout"><button>退出登录</button></a>
    {% else %}
        <h1>登录失败！</h1>
        <p>{{ message }}</p>
        <a href="/"><button>重新登录</button></a>
    {% endif %}
    
    {% if sql %}
        <br><br>
        <p>执行的 SQL：</p>
        <pre>{{ sql }}</pre>
    {% endif %}
</body>
</html>
